[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baomiguan-cli"
version = "2.0.0"
description = "保密观终端工具：动态年度活动、简洁交互与本机凭据保护"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "XingYuan Huo"}]
dependencies = [
  "rich>=14,<15", "requests>=2.32,<3", "keyring>=25.6,<26",
  "pycryptodome>=3.23,<5", "qrcode>=8.2,<9"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6.16,<7"]

[project.scripts]
baomiguan = "baomiguan.launcher:main"

[tool.setuptools.packages.find]
include = ["baomiguan*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
